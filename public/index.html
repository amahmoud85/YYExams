<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Desk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <a class="brand" href="#/">Exam Desk</a>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="main"><p class="hint">Loading…</p></main>
</div>
<div class="bar" id="bar" hidden><div class="in">
  <div class="prog"><span id="progtxt">0 of 0 answered</span><div class="track"><div class="fill" id="progfill"></div></div></div>
  <span class="savestate" id="savestate"></span>
  <button class="btn" id="submitbtn" type="button">Submit answers</button>
</div></div>
<script src="/app.js" type="module"></script>
</body>
</html>
